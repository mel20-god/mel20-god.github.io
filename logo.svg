<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1040"/>
      <stop offset="1" stop-color="#08051A"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.15" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.95" cy="1" r="0.75">
      <stop offset="0" stop-color="#FF2E7E" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FF2E7E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="230" y1="330" x2="800" y2="800">
      <stop offset="0" stop-color="#2EE6C8"/>
      <stop offset="0.5" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#FF3D7F"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="neon" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
    <filter id="soft" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="tile"><rect width="1024" height="1024" rx="232"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glowA)"/>
    <rect width="1024" height="1024" fill="url(#glowB)"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>

    <g transform="translate(0 -5)">
      <!-- halo néon -->
      <path d="M282 716 V318 L512 566 L742 318 V716" fill="none" stroke="url(#ink)" stroke-width="140"
            stroke-linecap="round" stroke-linejoin="round" filter="url(#neon)" opacity="0.95"/>
      <!-- le M -->
      <path d="M282 716 V318 L512 566 L742 318 V716" fill="none" stroke="url(#ink)" stroke-width="118"
            stroke-linecap="round" stroke-linejoin="round"/>
      <!-- cœur lumineux du tube -->
      <path d="M282 716 V318 L512 566 L742 318 V716" fill="none" stroke="#fff" stroke-opacity="0.38" stroke-width="16"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

  </g>
  <rect x="3" y="3" width="1018" height="1018" rx="229" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="6"/>
</svg>
